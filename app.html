<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fbf6ec" />
<title>Hochzeitstarot App</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Lora:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Layout: eine Smartphone-App – Kopfzeile, scrollender Inhalt, Tab-Leiste. Auf großen Bildschirmen im Gerätrahmen. */
  :root {
    --cream: #fbf6ec;      /* Kartengrund der Tarotkarten */
    --paper: #fffdf8;
    --ink: #2b2620;
    --muted: #7a6f62;
    --line: #e9dfcf;
    --navy: #253650;       /* Rückseite Kategoriekarten */
    --terra: #c46a43;      /* Rückseite Tarotkarten */
    --gold: #c9973f;       /* Ringe-Symbol */
    --olive: #8a8d4f;
    --desk: #e7dccb;
    --display: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
    --body: 'Lora', Georgia, 'Times New Roman', serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--desk); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--terra); outline-offset: 3px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; text-wrap: balance; }

  .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; }
  .app {
    position: relative; width: 100%; max-width: 430px; height: 100dvh;
    background: var(--cream); display: flex; flex-direction: column; overflow: hidden;
  }
  @media (min-width: 600px) {
    .stage { padding-block: 24px; }
    .app { height: min(880px, calc(100dvh - 48px)); border-radius: 40px; box-shadow: 0 30px 80px rgba(60,40,20,.25), 0 0 0 10px #2b2620; }
  }

  /* Kopfzeile */
  .top { padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 10px; display: flex; align-items: center; gap: 12px; }
  .top h1 { font-size: 26px; flex: 1; min-width: 0; }
  .top .back { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: var(--paper); border: 1px solid var(--line); }
  .chip { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; background: var(--paper); white-space: nowrap; }

  main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 20px 28px; -webkit-overflow-scrolling: touch; }
  .screen { display: grid; gap: 20px; animation: in .35s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Tab-Leiste */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--paper); padding: 6px 6px calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .tab { display: grid; justify-items: center; gap: 3px; padding: 6px 0; font-size: 11px; color: var(--muted); border-radius: 12px; }
  .tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tab[aria-current="page"] { color: var(--terra); font-weight: 600; }

  /* Bausteine */
  .card-img { display: block; width: 100%; aspect-ratio: 7 / 12; object-fit: cover; border-radius: 10px; background: var(--paper); box-shadow: 0 6px 18px rgba(60,40,20,.14); }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
  .label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px 20px; border-radius: 16px; background: var(--ink); color: var(--cream); font-weight: 600; font-size: 16px; transition: transform .15s; }
  .btn:active { transform: scale(.98); }
  .btn.terra { background: var(--terra); color: #fff; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* Start */
  .hello { display: grid; gap: 4px; }
  .hello .names { font-family: var(--display); font-size: 34px; font-weight: 700; }
  .count { display: flex; align-items: baseline; gap: 8px; }
  .count b { font-family: var(--display); font-size: 56px; line-height: 1; color: var(--terra); font-variant-numeric: tabular-nums; }
  .fan { position: relative; height: 150px; margin: 4px 0 -6px; }
  .fan img { position: absolute; left: 50%; bottom: 0; width: 78px; margin-left: -39px; transform-origin: 50% 100%; }
  .fan img:nth-child(1) { transform: translateX(-46px) rotate(-14deg); }
  .fan img:nth-child(2) { transform: translateY(-8px); z-index: 1; }
  .fan img:nth-child(3) { transform: translateX(46px) rotate(14deg); }
  .progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .progress-head h2 { font-size: 22px; }
  .cats { display: grid; gap: 10px; }
  .cat-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; font-size: 14px; text-align: left; }
  .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--olive); border-radius: 3px; transition: width .5s; }
  .last { display: grid; grid-template-columns: 54px 1fr; gap: 14px; align-items: center; text-align: left; }
  .last img { width: 54px; }

  /* Ziehen */
  .steps-ind { display: flex; gap: 6px; }
  .steps-ind i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .steps-ind i.on { background: var(--terra); }
  .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .cat-tile { display: grid; gap: 6px; text-align: center; font-size: 12px; line-height: 1.3; }
  .cat-tile .card-img { transition: transform .2s; }
  .cat-tile:active .card-img, .cat-tile:hover .card-img { transform: translateY(-4px); }
  .table { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .flip { display: block; width: 100%; perspective: 900px; aspect-ratio: 7 / 12; }
  .flip .in { display: block; position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.4,.2,.2,1); }
  .flip.open .in { transform: rotateY(180deg); }
  .flip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 8px 20px rgba(60,40,20,.18); }
  .flip img.front { transform: rotateY(180deg); }
  .deal { animation: deal .5s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes deal { from { opacity: 0; transform: translateY(-40px) rotate(-8deg) scale(.9); } }
  .round-cat { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
  .round-cat img { width: 64px; }
  .round-cat h2 { font-size: 24px; }
  .question { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 22px; line-height: 1.3; }
  .impulses { display: grid; gap: 10px; }
  .impulse { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; text-align: left; }
  .impulse img { width: 44px; border-radius: 6px; }
  .impulse b { font-family: var(--display); font-size: 18px; display: block; }
  .impulse p { font-size: 14px; color: var(--muted); line-height: 1.45; }
  .hint { text-align: center; font-size: 14px; color: var(--muted); }
  textarea, input[type="text"], input[type="date"] {
    width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 14px; padding: 14px;
    font: 16px/1.5 var(--body); color: var(--ink); resize: vertical;
  }
  textarea { min-height: 120px; }
  .field { display: grid; gap: 6px; }
  .field span { font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  /* Deck */
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .seg button { padding: 9px; border-radius: 9px; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
  .deck-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

  /* Notizen */
  .note { display: grid; gap: 10px; }
  .note-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .note-head b { font-family: var(--display); font-size: 20px; }
  .note-cards { display: flex; gap: 6px; }
  .note-cards img { width: 34px; border-radius: 4px; }
  .note p { font-size: 15px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { text-align: center; padding: 40px 10px; display: grid; gap: 12px; justify-items: center; }
  .empty img { width: 90px; transform: rotate(-6deg); }

  /* Mehr */
  .list { display: grid; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .list > * { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; text-align: left; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--ink); text-decoration: none; }
  .list > *:last-child { border-bottom: 0; }
  .list small { color: var(--muted); }
  .howto { display: grid; gap: 10px; counter-reset: s; }
  .howto li { list-style: none; display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 15px; line-height: 1.5; }
  .howto li::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--terra); color: #fff; display: grid; place-items: center; font: 700 15px var(--display); }

  /* Karten-Blatt (Bottom Sheet) */
  .sheet-bg { position: absolute; inset: 0; background: rgba(43,38,32,.55); display: flex; align-items: flex-end; z-index: 10; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { width: 100%; max-height: 92%; overflow-y: auto; background: var(--cream); border-radius: 28px 28px 0 0; padding: 12px 24px calc(env(safe-area-inset-bottom, 0px) + 24px); display: grid; gap: 16px; justify-items: center; text-align: center; animation: up .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { transform: translateY(100%); } }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
  .sheet img { width: min(58%, 220px); }
  .sheet h2 { font-size: 30px; }
  .sheet p { font-size: 16px; line-height: 1.55; max-width: 32ch; }

  .toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--cream); padding: 12px 20px; border-radius: 999px; font-size: 14px; z-index: 20; animation: in .25s; white-space: nowrap; }

  /* Onboarding */
  .onboard { position: absolute; inset: 0; z-index: 30; background: var(--cream); display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 32px 28px calc(env(safe-area-inset-bottom, 0px) + 28px); text-align: center; animation: fade .3s; }
  .onboard h1 { font-size: 40px; }
  .onboard .fan { height: 190px; }
  .onboard .fan img { width: 100px; margin-left: -50px; }
  .onboard form { display: grid; gap: 14px; text-align: left; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="app" id="app">
    <header class="top" id="top"></header>
    <main id="main"></main>
    <nav class="tabs" id="tabs" aria-label="Navigation">
      <button class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Start</button>
      <button class="tab" data-tab="draw"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="9" height="15" rx="1.5" transform="rotate(-8 8 12)"/><rect x="11" y="4" width="9" height="15" rx="1.5" transform="rotate(8 15 11)"/></svg>Ziehen</button>
      <button class="tab" data-tab="deck"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="8" rx="1"/><rect x="14" y="3" width="7" height="8" rx="1"/><rect x="3" y="13" width="7" height="8" rx="1"/><rect x="14" y="13" width="7" height="8" rx="1"/></svg>Deck</button>
      <button class="tab" data-tab="notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/></svg>Notizen</button>
    </nav>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- Inhalte ----------
  var IMG = 'images/deck/';
  var CATS = [
    { name: 'Zeremonie & Rituale', q: ['Welches Ritual soll eure Trauung ganz persönlich machen?', 'Wer soll bei der Zeremonie zu Wort kommen?', 'Welches Versprechen möchtet ihr euch geben?'] },
    { name: 'Gäste & Erinnerungen', q: ['Woran sollen sich eure Gäste in zehn Jahren noch erinnern?', 'Wen wollt ihr unbedingt dabeihaben?', 'Wie sammelt ihr die schönsten Momente des Tages?'] },
    { name: 'Ort & Umgebung', q: ['An welchem Ort fühlt ihr euch beide sofort zu Hause?', 'Drinnen, draußen oder beides?', 'Wie sollen eure Gäste den Ort zum ersten Mal erleben?'] },
    { name: 'Dekoration & Styling', q: ['Welche drei Worte beschreiben den Look eures Tages?', 'Welches Detail soll eure Handschrift tragen?', 'Was darf weg, weil es nicht zu euch passt?'] },
    { name: 'Musik & Atmosphäre', q: ['Welcher Song begleitet euren ersten Tanz?', 'Wann soll es ruhig sein, wann wird gefeiert?', 'Welche Musik erzählt eure gemeinsame Geschichte?'] },
    { name: 'Essen & Getränke', q: ['Welches Gericht erzählt eure gemeinsame Geschichte?', 'Buffet, Menü oder Foodtrucks?', 'Mit welchem Getränk stoßt ihr an?'] }
  ];
  var TAROT = [
    ['Der Impuls', 'Was wollt ihr als Allererstes angehen, ohne lange zu zögern?'],
    ['Der neue Weg', 'Welche Tradition dürft ihr bewusst anders machen?'],
    ['Der frische Blick', 'Wie würde jemand von außen dieses Thema sehen?'],
    ['Die weise Stimme', 'Wessen Rat zählt für euch hier am meisten?'],
    ['Das Unperfekte', 'Wo darf es ruhig ungeplant und echt sein?'],
    ['Der Trend', 'Was gefällt euch wirklich und was nur, weil es alle machen?'],
    ['Das Farbgefühl', 'Welche Farben und Stimmungen passen zu euch beiden?'],
    ['Der helle Funken', 'Welche spontane Idee bringt euch beide zum Strahlen?'],
    ['Die Technik', 'Was braucht ihr ganz praktisch, damit alles reibungslos läuft?'],
    ['Der Teamgeist', 'Wen könnt ihr einbinden, um diese Aufgabe zu teilen?'],
    ['Die Planerin', 'Welcher nächste konkrete Schritt steht an, und bis wann?'],
    ['Der leitende Stern', 'Welcher gemeinsame Wert soll diese Entscheidung führen?'],
    ['Die Dankbarkeit', 'Wem möchtet ihr an diesem Punkt Danke sagen?'],
    ['Der Sonnenschein', 'Was macht dieses Thema leicht und fröhlich?'],
    ['Die helfende Hand', 'Wo dürft ihr Hilfe annehmen?'],
    ['Der Moment', 'Welcher Augenblick soll für immer bleiben?'],
    ['Der offene Himmel', 'Was würdet ihr tun, wenn es keine Grenzen gäbe?'],
    ['Die Gemeinsamkeit', 'Worin seid ihr euch hier schon völlig einig?'],
    ['Die Erinnerung', 'Welche gemeinsame Geschichte gehört unbedingt dazu?'],
    ['Die offene Tür', 'Wen oder was wollt ihr an diesem Tag willkommen heißen?'],
    ['Die Details', 'Welche Kleinigkeit macht für euch den großen Unterschied?'],
    ['Der erste Tanz', 'Wie wollt ihr euch in diesem Moment fühlen?'],
    ['Der Geschmack', 'Was soll euren Gästen besonders gut schmecken?'],
    ['Die geheime Zutat', 'Welche Überraschung baut ihr ein?'],
    ['Der Soundtrack', 'Welche Musik erzählt hier eure Geschichte?'],
    ['Das Lachen', 'Wo darf es so richtig lustig werden?'],
    ['Der besondere Gast', 'Wer verdient an diesem Tag einen Ehrenplatz?'],
    ['Das Rampenlicht', 'Wann wollt ihr im Mittelpunkt stehen und wann lieber nicht?'],
    ['Der Toast', 'Worauf wollt ihr gemeinsam anstoßen?'],
    ['Der familiäre Kreis', 'Wie bezieht ihr eure Familien mit ein?']
  ];
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var tarotImg = function (i) { return IMG + 'tarot-' + pad(i + 1) + '.jpg'; };
  var catImg = function (i) { return IMG + 'kategorie-' + (i + 1) + '.jpg'; };
  var BACK_T = IMG + 'tarot-rueckseite.jpg', BACK_C = IMG + 'kategorie-rueckseite.jpg';

  // ---------- Zustand (lokal im Browser) ----------
  var KEY = 'hochzeitstarot-app-v1';
  var inDays = function (d) { var x = new Date(); x.setDate(x.getDate() + d); return x.toISOString().slice(0, 10); };
  var sample = function () {
    return {
      sample: true, onboarded: true, names: 'Lea & Martin', date: inDays(143),
      notes: [
        { id: 2, cat: 4, cards: [24, 21, 25], q: 'Welcher Song begleitet euren ersten Tanz?', text: 'Erster Tanz: „La Vie en Rose“ in der Live-Version.\nDanach direkt Party, ohne lange Pause. Die Band fragen, ob sie das Lied lernen kann.', at: Date.now() - 2 * 864e5 },
        { id: 1, cat: 0, cards: [1, 17, 3], q: 'Welches Ritual soll eure Trauung ganz persönlich machen?', text: 'Freie Trauung im Garten. Wir schreiben unser Eheversprechen selbst, Oma Hilde liest ein Gedicht.', at: Date.now() - 9 * 864e5 }
      ]
    };
  };
  var load = function () {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.notes) return s; } catch (e) {}
    return sample();
  };
  var state = load();
  var save = function () { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  // ---------- Hilfen ----------
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var shuffle = function (n) { var a = []; for (var i = 0; i < n; i++) a.push(i); for (var j = n - 1; j > 0; j--) { var r = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[r]; a[r] = t; } return a; };
  var daysLeft = function () { if (!state.date) return null; return Math.ceil((new Date(state.date + 'T12:00') - new Date()) / 864e5); };
  var fmtDate = function (iso) { return new Date(iso + 'T12:00').toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' }); };
  var ago = function (t) { var d = Math.round((Date.now() - t) / 864e5); return d <= 0 ? 'heute' : d === 1 ? 'gestern' : 'vor ' + d + ' Tagen'; };
  var app = $('#app'), main = $('#main'), top = $('#top');
  var toast = function (msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; app.appendChild(t); setTimeout(function () { t.remove(); }, 2200); };

  // ---------- Navigation ----------
  var current = 'home';
  var round = null; // laufende Ziehrunde
  var go = function (tab) {
    current = tab;
    document.querySelectorAll('.tab').forEach(function (b) { b.toggleAttribute('aria-current', b.dataset.tab === tab); if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); });
    main.scrollTop = 0;
    ({ home: home, draw: draw, deck: deck, notes: notes, more: more })[tab]();
  };
  document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { go(b.dataset.tab); }); });
  var header = function (title, opts) {
    opts = opts || {};
    top.innerHTML = (opts.back ? '<button class="back" id="back" aria-label="Zurück">‹</button>' : '') +
      '<h1>' + esc(title) + '</h1>' + (opts.right || '');
    if (opts.back) $('#back').addEventListener('click', opts.back);
  };
  var moreBtn = '<button class="chip" id="more-btn">Mehr</button>';
  var bindMore = function () { var m = $('#more-btn'); if (m) m.addEventListener('click', function () { go('more'); }); };

  // ---------- Karten-Blatt ----------
  var openCard = function (type, i) {
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    var isT = type === 't';
    bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Karte">' +
      '<div class="grab"></div>' +
      '<img class="card-img" src="' + (isT ? tarotImg(i) : catImg(i)) + '" alt="" />' +
      '<div class="label">' + (isT ? 'Tarotkarte ' + (i + 1) + ' von 30' : 'Kategoriekarte') + '</div>' +
      '<h2>' + esc(isT ? TAROT[i][0] : CATS[i].name) + '</h2>' +
      '<p>' + esc(isT ? TAROT[i][1] : CATS[i].q[0]) + '</p>' +
      (isT ? '' : '<button class="btn terra" id="sheet-play">Runde mit dieser Kategorie</button>') +
      '<button class="btn ghost" id="sheet-close">Schließen</button></div>';
    app.appendChild(bg);
    var close = function () { bg.remove(); };
    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    $('#sheet-close', bg).addEventListener('click', close);
    var play = $('#sheet-play', bg);
    if (play) play.addEventListener('click', function () { close(); startRound(i); });
    $('#sheet-close', bg).focus();
  };

  // ---------- Start ----------
  var home = function () {
    header('Hochzeitstarot', { right: (state.sample ? '<span class="chip">Beispiel</span>' : '') + moreBtn });
    bindMore();
    var d = daysLeft();
    var counts = CATS.map(function (_, i) { return state.notes.filter(function (n) { return n.cat === i; }).length; });
    var done = counts.filter(Boolean).length;
    var last = state.notes[0];
    main.innerHTML = '<div class="screen">' +
      '<div class="hello"><span class="label">Eure Planung</span><div class="names">' + esc(state.names || 'Ihr zwei') + '</div>' +
      (d !== null ? '<div class="count"><b>' + Math.max(d, 0) + '</b><span class="muted">' + (d === 1 ? 'Tag' : 'Tage') + ' bis zum ' + esc(fmtDate(state.date)) + '</span></div>' : '') + '</div>' +
      '<div class="fan" aria-hidden="true"><img class="card-img" src="' + tarotImg(21) + '" alt=""><img class="card-img" src="' + tarotImg(7) + '" alt=""><img class="card-img" src="' + tarotImg(28) + '" alt=""></div>' +
      '<button class="btn terra" id="start-round">Neue Runde ziehen</button>' +
      '<section class="panel"><div class="progress-head"><h2>Eure Themen</h2><span class="muted small">' + done + ' von 6 besprochen</span></div><div class="cats">' +
      CATS.map(function (c, i) {
        return '<button class="cat-row" data-cat="' + i + '"><span>' + esc(c.name) + '</span><span class="muted small">' + (counts[i] ? counts[i] + ' Notiz' + (counts[i] > 1 ? 'en' : '') : 'offen') + '</span><span class="bar"><i style="width:' + Math.min(100, counts[i] * 50) + '%"></i></span></button>';
      }).join('') + '</div></section>' +
      (last ? '<section class="panel"><div class="label" style="margin-bottom:12px">Zuletzt festgehalten · ' + ago(last.at) + '</div>' +
        '<button class="last" id="last-note"><img class="card-img" src="' + catImg(last.cat) + '" alt=""><span><b style="font-family:var(--display);font-size:19px">' + esc(CATS[last.cat].name) + '</b><br><span class="muted small">' + esc(last.text.split('\n')[0]) + '</span></span></button></section>' : '') +
      '</div>';
    $('#start-round').addEventListener('click', function () { round = null; go('draw'); });
    main.querySelectorAll('.cat-row').forEach(function (b) { b.addEventListener('click', function () { startRound(+b.dataset.cat); }); });
    if (last) $('#last-note').addEventListener('click', function () { go('notes'); });
  };

  // ---------- Ziehen ----------
  var startRound = function (cat) {
    var pick = shuffle(30).slice(0, 3);
    round = { step: 2, cat: cat, cards: pick, open: [false, false, false], q: CATS[cat].q[Math.floor(Math.random() * 3)], text: '' };
    go('draw');
  };
  var stepsInd = function (n) { return '<div class="steps-ind" aria-label="Schritt ' + n + ' von 3"><i class="on"></i><i class="' + (n > 1 ? 'on' : '') + '"></i><i class="' + (n > 2 ? 'on' : '') + '"></i></div>'; };

  var draw = function () {
    if (!round || round.step === 1) return drawStep1();
    if (round.step === 2) return drawStep2();
    return drawStep3();
  };
  var drawStep1 = function () {
    round = { step: 1 };
    header('Neue Runde', { right: moreBtn }); bindMore();
    main.innerHTML = '<div class="screen">' + stepsInd(1) +
      '<div><div class="label">Schritt 1</div><h2 style="font-size:28px;margin-top:4px">Welches Thema ist dran?</h2></div>' +
      '<div class="cat-grid">' + CATS.map(function (c, i) {
        return '<button class="cat-tile" data-cat="' + i + '"><img class="card-img" src="' + catImg(i) + '" alt=""><span>' + esc(c.name) + '</span></button>';
      }).join('') + '</div>' +
      '<button class="btn ghost" id="random-cat">Zufällig ziehen</button></div>';
    main.querySelectorAll('.cat-tile').forEach(function (b) { b.addEventListener('click', function () { startRound(+b.dataset.cat); }); });
    $('#random-cat').addEventListener('click', function () { startRound(Math.floor(Math.random() * 6)); });
  };
  var drawStep2 = function () {
    header('Neue Runde', { back: function () { round = null; go('draw'); } });
    var allOpen = round.open.every(Boolean);
    main.innerHTML = '<div class="screen">' + stepsInd(2) +
      '<div class="round-cat"><img class="card-img" src="' + catImg(round.cat) + '" alt=""><div><div class="label">Kategorie</div><h2>' + esc(CATS[round.cat].name) + '</h2></div></div>' +
      '<div class="panel question">„' + esc(round.q) + '“</div>' +
      '<div class="table">' + round.cards.map(function (c, i) {
        return '<button class="flip deal' + (round.open[i] ? ' open' : '') + '" data-i="' + i + '" style="animation-delay:' + (i * 120) + 'ms" aria-label="' + (round.open[i] ? esc(TAROT[c][0]) : 'Karte ' + (i + 1) + ' aufdecken') + '"><span class="in"><img src="' + BACK_T + '" alt=""><img class="front" src="' + tarotImg(c) + '" alt=""></span></button>';
      }).join('') + '</div>' +
      '<p class="hint" id="hint">' + (allOpen ? 'Tippt auf einen Impuls, um die Karte groß zu sehen.' : 'Tippt auf die Karten, um sie aufzudecken.') + '</p>' +
      '<div class="impulses" id="impulses">' + impulsesHtml() + '</div>' +
      '<button class="btn" id="to-note"' + (allOpen ? '' : ' disabled') + '>Gemeinsam festhalten</button></div>';
    main.querySelectorAll('.flip').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = +b.dataset.i;
        if (round.open[i]) return openCard('t', round.cards[i]);
        round.open[i] = true; b.classList.add('open');
        b.setAttribute('aria-label', TAROT[round.cards[i]][0]);
        $('#impulses').innerHTML = impulsesHtml(); bindImpulses();
        if (round.open.every(Boolean)) { $('#to-note').disabled = false; $('#hint').textContent = 'Sprecht über die drei Impulse. Was nehmt ihr mit?'; }
      });
    });
    bindImpulses();
    $('#to-note').addEventListener('click', function () { round.step = 3; draw(); });
  };
  var impulsesHtml = function () {
    return round.cards.map(function (c, i) {
      if (!round.open[i]) return '';
      return '<button class="impulse panel" data-card="' + c + '"><img class="card-img" src="' + tarotImg(c) + '" alt=""><span><b>' + esc(TAROT[c][0]) + '</b><p>' + esc(TAROT[c][1]) + '</p></span></button>';
    }).join('');
  };
  var bindImpulses = function () { main.querySelectorAll('.impulse').forEach(function (b) { b.addEventListener('click', function () { openCard('t', +b.dataset.card); }); }); };

  var drawStep3 = function () {
    header('Festhalten', { back: function () { round.step = 2; draw(); } });
    main.innerHTML = '<div class="screen">' + stepsInd(3) +
      '<div class="round-cat"><img class="card-img" src="' + catImg(round.cat) + '" alt=""><div><div class="label">' + esc(CATS[round.cat].name) + '</div><p class="question" style="font-size:19px;margin-top:4px">„' + esc(round.q) + '“</p></div></div>' +
      '<div class="note-cards">' + round.cards.map(function (c) { return '<img class="card-img" src="' + tarotImg(c) + '" alt="' + esc(TAROT[c][0]) + '">'; }).join('') + '<span class="muted small" style="align-self:center;margin-left:6px">' + round.cards.map(function (c) { return esc(TAROT[c][0]); }).join(' · ') + '</span></div>' +
      '<label class="field"><span>Was habt ihr entschieden oder entdeckt?</span><textarea id="note-text" placeholder="z. B. Wir wünschen uns …">' + esc(round.text) + '</textarea></label>' +
      '<button class="btn terra" id="save-note">Entscheidung speichern</button>' +
      '<button class="btn ghost" id="skip-note">Ohne Notiz beenden</button></div>';
    var ta = $('#note-text');
    ta.addEventListener('input', function () { round.text = ta.value; });
    $('#save-note').addEventListener('click', function () {
      var text = ta.value.trim();
      if (!text) { ta.focus(); ta.placeholder = 'Ein Satz genügt schon.'; return; }
      state.notes.unshift({ id: Date.now(), cat: round.cat, cards: round.cards, q: round.q, text: text, at: Date.now() });
      save(); round = null; toast('Gespeichert');
      go('notes');
    });
    $('#skip-note').addEventListener('click', function () { round = null; go('home'); });
  };

  // ---------- Deck ----------
  var deckSet = 't';
  var deck = function () {
    header('Das Deck', { right: moreBtn }); bindMore();
    var items = deckSet === 't' ? TAROT.map(function (t, i) { return i; }) : CATS.map(function (c, i) { return i; });
    main.innerHTML = '<div class="screen">' +
      '<div class="seg"><button aria-pressed="' + (deckSet === 't') + '" data-set="t">Tarot · 30</button><button aria-pressed="' + (deckSet === 'c') + '" data-set="c">Kategorien · 6</button></div>' +
      '<div class="deck-grid">' + items.map(function (i) {
        return '<button class="deck-item" data-i="' + i + '" aria-label="' + esc(deckSet === 't' ? TAROT[i][0] : CATS[i].name) + '"><img class="card-img" loading="lazy" src="' + (deckSet === 't' ? tarotImg(i) : catImg(i)) + '" alt=""></button>';
      }).join('') + '</div></div>';
    main.querySelectorAll('.seg button').forEach(function (b) { b.addEventListener('click', function () { deckSet = b.dataset.set; deck(); }); });
    main.querySelectorAll('.deck-item').forEach(function (b) { b.addEventListener('click', function () { openCard(deckSet, +b.dataset.i); }); });
  };

  // ---------- Notizen ----------
  var notes = function () {
    header('Eure Notizen', { right: moreBtn }); bindMore();
    if (!state.notes.length) {
      main.innerHTML = '<div class="screen"><div class="empty"><img class="card-img" src="' + BACK_T + '" alt=""><h2 style="font-size:26px">Noch keine Notizen</h2><p class="muted">Zieht eine Runde und haltet fest, was ihr entschieden habt.</p><button class="btn terra" id="first">Erste Runde ziehen</button></div></div>';
      $('#first').addEventListener('click', function () { round = null; go('draw'); });
      return;
    }
    main.innerHTML = '<div class="screen">' + state.notes.map(function (n) {
      return '<article class="panel note"><div class="note-head"><b>' + esc(CATS[n.cat].name) + '</b><span class="muted small">' + ago(n.at) + '</span></div>' +
        '<div class="muted small" style="font-style:italic">„' + esc(n.q) + '“</div>' +
        '<div class="note-cards">' + n.cards.map(function (c) { return '<img class="card-img" src="' + tarotImg(c) + '" alt="' + esc(TAROT[c][0]) + '" title="' + esc(TAROT[c][0]) + '">'; }).join('') + '</div>' +
        '<p>' + esc(n.text) + '</p>' +
        '<button class="chip" data-del="' + n.id + '" style="justify-self:start">Löschen</button></article>';
    }).join('') + '</div>';
    main.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.confirm) {
          state.notes = state.notes.filter(function (n) { return String(n.id) !== b.dataset.del; });
          save(); notes(); toast('Notiz gelöscht');
        } else { b.dataset.confirm = '1'; b.textContent = 'Wirklich löschen?'; b.style.color = 'var(--terra)'; }
      });
    });
  };

  // ---------- Mehr ----------
  var more = function () {
    header('Mehr', { back: function () { go('home'); } });
    document.querySelectorAll('.tab').forEach(function (b) { b.removeAttribute('aria-current'); });
    main.innerHTML = '<div class="screen">' +
      '<section class="panel"><h2 style="font-size:24px;margin-bottom:14px">So spielt ihr</h2><ol class="howto">' +
      '<li>Wählt eine Kategoriekarte: Sie gibt das Thema vor.</li>' +
      '<li>Zieht drei Tarotkarten und deckt sie nacheinander auf.</li>' +
      '<li>Lasst euch von Bild und Name inspirieren und sprecht über die Frage.</li>' +
      '<li>Haltet fest, was ihr entschieden habt. Und habt Spaß!</li></ol></section>' +
      '<section class="list">' +
      '<button id="edit">Namen & Datum ändern<small>' + esc(state.names || '') + '</small></button>' +
      '<a href="index.html#bestellen" target="_blank" rel="noopener">Das Deck als Karten bestellen<small>29 €</small></a>' +
      '<button id="reset">' + (state.sample ? 'Beispieldaten entfernen' : 'Alles zurücksetzen') + '<small>Neu starten</small></button>' +
      '</section>' +
      '<p class="muted small" style="text-align:center">Prototyp · Eure Notizen bleiben nur auf diesem Gerät.</p></div>';
    $('#edit').addEventListener('click', onboarding);
    $('#reset').addEventListener('click', function () {
      var b = $('#reset');
      if (!b.dataset.confirm) { b.dataset.confirm = '1'; b.firstChild.textContent = 'Wirklich alles löschen?'; b.style.color = 'var(--terra)'; return; }
      state = { onboarded: false, names: '', date: '', notes: [] }; save(); onboarding();
    });
  };

  // ---------- Onboarding ----------
  var onboarding = function () {
    var o = document.createElement('div'); o.className = 'onboard';
    o.innerHTML = '<div class="fan" aria-hidden="true"><img class="card-img" src="' + BACK_C + '" alt=""><img class="card-img" src="' + tarotImg(21) + '" alt=""><img class="card-img" src="' + BACK_T + '" alt=""></div>' +
      '<div><div class="label">Willkommen beim</div><h1>Hochzeitstarot</h1><p class="muted" style="margin-top:8px">36 Karten, die euch durch die Planung begleiten.</p></div>' +
      '<form id="ob-form"><label class="field"><span>Eure Namen</span><input type="text" id="ob-names" placeholder="z. B. Lea & Martin" value="' + esc(state.sample ? '' : state.names || '') + '" autocomplete="off"></label>' +
      '<label class="field"><span>Euer Hochzeitsdatum</span><input type="date" id="ob-date" value="' + esc(state.sample ? '' : state.date || '') + '"></label>' +
      '<button class="btn terra" type="submit">Los geht’s</button></form>';
    app.appendChild(o);
    $('#ob-form', o).addEventListener('submit', function (e) {
      e.preventDefault();
      var wasSample = state.sample;
      state.names = $('#ob-names', o).value.trim() || 'Ihr zwei';
      state.date = $('#ob-date', o).value;
      state.onboarded = true;
      if (wasSample) { state.notes = []; delete state.sample; }
      save(); o.remove(); go('home');
    });
  };

  go('home');
  if (!state.onboarded) onboarding();
})();
</script>
</body>
</html>
